[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ── Forma canônica das URLs ────────────────────────────────────────────────
#
# O Netlify liga "Pretty URLs" por padrão, e ele acrescenta barra ao fim de
# todo caminho de diretório: `/hipnoterapia` responde 301 para
# `/hipnoterapia/`.
#
# Isso brigava com o resto do site. O canônico de cada página, o sitemap, os
# dados estruturados e todos os links internos usam a forma SEM barra. O
# resultado, medido em produção: as dez URLs do sitemap respondiam 301, e
# cada etiqueta canônica apontava para um endereço que redirecionava. O
# Google resolve, mas registra "Página com redirecionamento" no relatório de
# cobertura, gasta rastreio em saltos que não precisavam existir e acaba
# indexando uma URL diferente da que o site declara como preferida.
#
# Desligado, o Netlify serve `/hipnoterapia` direto do arquivo
# `dist/hipnoterapia/index.html`, com 200 e sem salto.
[build.processing.html]
  pretty_urls = false

[build.environment]
  # Fixa a versão do Node. Sem isto o Netlify usa a mais recente que tiver
  # na imagem, e uma troca de major pode quebrar o build sem nenhuma
  # mudança no código.
  NODE_VERSION = "22"

# ── Canonicalização de host ────────────────────────────────────────────────
#
# O mesmo site em `www.` e sem `www.` são dois sites para o rastreador, e a
# autoridade acumulada por links externos se divide entre os dois. O 301
# resolve o desempate de uma vez: transfere o peso do endereço antigo e
# ensina o robô a esquecer a variante.
#
# O HTTPS o Netlify já força sozinho, com 301, em todos os domínios que
# gerencia — por isso não há regra de protocolo aqui.
[[redirects]]
  from = "https://www.institutobrunosena.com.br/*"
  to = "https://institutobrunosena.com.br/:splat"
  status = 301
  force = true

# ── Rotas do painel interno ────────────────────────────────────────────────
#
# NÃO existe mais o `/*  →  /index.html  200` que havia aqui.
#
# Aquela regra era necessária quando o site era uma SPA pura: nenhum
# endereço tinha arquivo próprio, e sem o fallback abrir `/hipnoterapia`
# direto devolvia 404. Agora o build pré-renderiza um arquivo HTML por rota
# (`scripts/prerender.mjs`), então cada endereço real existe em disco e é
# servido diretamente — com o conteúdo já dentro da resposta.
#
# Manter o fallback teria um custo: qualquer endereço inventado passaria a
# responder 200 com a home dentro. É o "soft 404" — o Google indexa uma
# quantidade indefinida de URLs que não existem, todas com o mesmo conteúdo,
# e gasta nelas o orçamento de rastreio que deveria ir para as páginas reais.
# Sem a regra, o Netlify devolve o `404.html` gerado no build, com status 404
# de verdade.

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# ── Cache ──────────────────────────────────────────────────────────────────

# Os arquivos em /assets levam hash no nome, então nunca mudam de
# conteúdo: podem ser guardados em cache para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As fontes também são imutáveis na prática: trocar de fonte significa
# trocar de arquivo. Sem esta regra, cada visita revalida quatro woff2 que
# nunca mudaram — e a fonte é bloqueante para a primeira pintura de texto.
[[headers]]
  for = "/fontes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# As artes das formações mudam de vez em quando, mas não de hora em hora:
# uma semana de cache com revalidação em segundo plano tira as imagens do
# caminho crítico sem congelar uma troca de capa por um ano.
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# O HTML NÃO entra em cache longo. Ele agora carrega o conteúdo da página,
# o canônico e os dados estruturados: se ficar congelado no navegador ou no
# CDN, uma correção de preço ou de texto continua sendo servida errada.
# `must-revalidate` obriga a checar a cada visita — a resposta é 304 e
# custa quase nada quando nada mudou.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS: o navegador passa a exigir HTTPS neste domínio por um ano, sem
    # nem tentar a versão insegura. Fecha a janela do primeiro acesso, em
    # que o pedido ainda sai em HTTP e só depois é redirecionado — que é
    # exatamente onde um redirecionamento pode ser sequestrado.
    #
    # `preload` está declarado, mas só passa a valer depois de submeter o
    # domínio em hstspreload.org. Antes de submeter, confirme que TODOS os
    # subdomínios servem HTTPS: a lista é embutida nos navegadores e sair
    # dela leva meses.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # ── Política de conteúdo ───────────────────────────────────────────────
    #
    # DUAS políticas, e é de propósito.
    #
    # A que VALE (`Content-Security-Policy`) traz só as diretivas que não
    # dependem de inventário de terceiros e por isso não têm como quebrar
    # uma página: nenhum <base> injetado pode reescrever o destino dos links
    # relativos, nenhum <object>/<embed> roda, nenhum formulário posta para
    # fora do site, e o site só pode ser emoldurado por ele mesmo.
    #
    # A segunda (`-Report-Only`) é a política INTEIRA — a que de fato
    # transforma um XSS em nada, restringindo de onde o navegador aceita
    # script. Ela ainda não bloqueia: o site fala com GA4, Firebase Auth,
    # Firestore, Sentry, YouTube e Vimeo, e uma origem esquecida na lista
    # derruba em produção justamente a parte que capta lead. Em modo de
    # relatório o navegador só REGISTRA a violação no console.
    #
    # COMO PROMOVER, depois de alguns dias de tráfego real: abra o site,
    # aceite os cookies, entre no /admin, envie um formulário e assista a um
    # vídeo com o console aberto. Se nenhuma linha "Report Only" aparecer,
    # apague a política curta acima, tire o sufixo `-Report-Only` desta e
    # devolva a ela o `upgrade-insecure-requests` (a diretiva é ignorada
    # em modo de relatório, e deixá-la aqui só encheria o console de um
    # aviso permanente que esconderia os relatórios de verdade).
    # Se aparecer, a linha diz a origem que falta.
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://gen-lang-client-0868573644.firebaseapp.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://www.youtube-nocookie.com https://player.vimeo.com https://accounts.google.com https://gen-lang-client-0868573644.firebaseapp.com; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'"

    # O que o navegador NÃO pode pedir em nome deste site. Câmera,
    # microfone e localização nunca são usados aqui: declarar isso fecha
    # a porta para um script injetado que tentasse pedi-los, e tira o
    # susto do visitante que veria a permissão aparecer. As capacidades
    # que sobram são as que os players de vídeo precisam — e só para as
    # duas origens que os servem.
    # As aspas em volta de cada origem são da sintaxe do próprio cabeçalho
    # Permissions-Policy, e por isso precisam vir escapadas (`\"`) dentro da
    # string do TOML — sem o escape, o TOML lia a primeira aspa da origem
    # como o fim do valor.
    Permissions-Policy = "accelerometer=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), autoplay=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), gyroscope=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\" \"https://player.vimeo.com\"), browsing-topics=(), camera=(), display-capture=(), geolocation=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"

    # Isola a janela de outras abas que tenham sido abertas a partir
    # dela. `allow-popups` em vez de `same-origin` puro porque o login
    # com Google é um popup, e o modo estrito cortaria a comunicação
    # entre ele e a página que o abriu — o /admin deixaria de entrar.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

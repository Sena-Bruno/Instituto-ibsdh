name: CI

on:
  pull_request:
  push:
    branches: [main]

# Um PR que recebe vários pushes seguidos não precisa rodar tudo em
# paralelo: cancela a execução anterior e roda só a mais recente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # As mensagens de commit do PR, verificadas contra commitlint.config.mjs.
  # Fica em job próprio: é a checagem mais rápida de todas e não depende de
  # build, então aparece vermelha em segundos em vez de no fim da fila.
  #
  # `if` limita ao PR de propósito. Num push para a main o histórico já está
  # escrito, e reprovar mensagem que não há mais como corrigir só produziria
  # CI vermelho permanente.
  mensagens:
    name: Mensagens de commit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O commitlint compara a base com a cabeça do PR, e para isso precisa
          # do histórico completo — o checkout raso traz um commit só.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verificar as mensagens do PR
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  # As regras do Firestore são a única coisa que separa a lista de leads —
  # nome e e-mail sob a LGPD — do resto da internet, e nenhum outro
  # verificador as lê: são uma linguagem à parte, avaliada pelo servidor do
  # Google. Job próprio porque depende do emulador, que é Java e leva alguns
  # segundos para subir; não faz sentido atrasar o lint por causa disso.
  regras:
    name: Regras do Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # O emulador do Firestore roda em cima de uma JVM, e as versões
      # recentes do firebase-tools passaram a exigir JDK 21+. A imagem do
      # runner nem sempre tem uma versão compatível no PATH por padrão —
      # sem este passo, o emulador recusa subir com "no longer supports
      # Java version before 21", antes mesmo de tentar ler uma regra.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # Fora do package.json pelo mesmo motivo do Playwright: o emulador
      # baixa um .jar de dezenas de MB, inútil no build de produção.
      - name: Instalar o emulador
        run: npm install --no-save firebase-tools @firebase/rules-unit-testing

      - name: Testar as regras
        run: npm run regras

  qualidade:
    name: Tipos, lint e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci em vez de install: respeita o package-lock e falha se ele
      # estiver fora de sincronia com o package.json — que foi exatamente
      # o tipo de problema que quebrou um deploy antes.
      - run: npm ci

      - name: Checagem de tipos
        run: npx tsc --noEmit && npx tsc --noEmit -p tsconfig.node.json

      - name: Lint e formatação
        run: npx biome check

      - name: Código e dependências mortas
        run: npx knip --no-config-hints

      # Direção das dependências entre pastas — o que o lint não vê, porque
      # olha arquivo por arquivo. Pega ciclo, config importando componente e
      # página importando página (que junta dois chunks e desfaz o code
      # splitting sem que o build acuse nada).
      - name: Contrato de arquitetura
        run: npm run arch

      # Antes do build de propósito: os testes rodam em segundos e cobrem a
      # lógica de preço, checkout e captação de lead. Falhar aqui evita
      # gastar o build e o job de navegador para descobrir o mesmo problema.
      - name: Testes unitários e de integração
        run: npm run test:coverage

      # O token só é exigido em repositório privado. Sem ele configurado o
      # passo avisa e segue: cobertura não publicada não é motivo para
      # reprovar um PR cujos testes passaram.
      - name: Publicar cobertura no Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      - name: Guardar o build para o teste de navegador
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  navegador:
    name: Teste de navegador
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Instalado só aqui, e não como dependência do projeto: o Playwright
      # baixa centenas de MB de navegadores, o que atrasaria todo build de
      # produção sem servir para nada lá.
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Servir o build e rodar o teste
        run: |
          npx vite preview --port 4173 --host 127.0.0.1 &
          # Espera o servidor responder, sem depender de outro pacote só
          # para isso. Desiste em 60s para não travar o job.
          for i in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/ || { echo "servidor não subiu"; exit 1; }
          SMOKE_URL=http://127.0.0.1:4173 node scripts/smoke.mjs

      # Os cabeçalhos de segurança não passam pelo `vite preview`: ele não
      # conhece o netlify.toml. Este passo sobe o `dist` com os cabeçalhos
      # lidos de lá e falha se o navegador recusar qualquer recurso — que é
      # a única forma de uma política de conteúdo errada ser pega ANTES do
      # deploy, e não por um formulário que parou de gravar em produção.
      - name: Cabeçalhos de segurança
        run: node scripts/cabecalhos.mjs

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090B" />

    <!-- Bloco substituído por rota no build; ver scripts/prerender.mjs.
         O que está escrito aqui é o padrão da home e só vale em `vite dev`.
         Não acrescente aqui tag que uma página também emita pelo Helmet. -->
    <!-- seo:inicio -->
    <title>Instituto Bruno Sena | Formações em PNL, Hipnoterapia e Coaching</title>
    <meta name="description" content="Formações em PNL, Hipnoterapia e Coaching do Instituto Bruno Sena. Método estruturado, certificação reconhecida e prática clínica supervisionada." />
    <link rel="canonical" href="https://institutobrunosena.com.br/" />
    <meta property="og:site_name" content="Instituto Bruno Sena" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://institutobrunosena.com.br/" />
    <meta property="og:title" content="Instituto Bruno Sena | Formações em PNL, Hipnoterapia e Coaching" />
    <meta property="og:description" content="Método estruturado, certificação reconhecida e prática clínica supervisionada." />
    <meta property="og:image" content="https://institutobrunosena.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Instituto Bruno Sena | Formações em PNL, Hipnoterapia e Coaching" />
    <meta name="twitter:description" content="Método estruturado, certificação reconhecida e prática clínica supervisionada." />
    <meta name="twitter:image" content="https://institutobrunosena.com.br/og-image.png" />
    <!-- seo:fim -->

    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/logo-do-instituto.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Aqui NÃO entra preload de imagem: este arquivo é o molde das 14
         rotas, e uma imagem prioritária é sempre de UMA página. Havia um,
         da capa do vídeo da home, e nas outras 13 rotas ele furava a fila
         na frente da imagem que a página ia realmente desenhar. Cada
         página marca a sua com `fetchPriority` no próprio <img>, e o React
         emite o preload — ver `capaPrioritaria` em components/Video.tsx. -->

    <!-- Oswald no display e Lato no texto.

         Outfit e Inter saíram porque são as fontes padrão de produto de
         software: o desenho geométrico e a largura uniforme fazem qualquer
         página parecer painel de aplicativo. Oswald é condensada e pesada,
         então o título ocupa a largura inteira sem encolher de corpo e lê
         como algo gravado, não como interface. Lato é humanista e morna,
         que é o contraponto que o texto corrido precisa para não ficar
         frio ao lado de um título tão duro. -->
    <link rel="preload" as="font" type="font/woff2" href="/fontes/oswald-700-lat.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fontes/lato-400-lat.woff2" crossorigin />
  </head>
  <body class="bg-brand-dark text-brand-platinum antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

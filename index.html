    <!-- Elemento LCP da home. -->
    <link rel="preload" as="image" href="/brunosena.webp" fetchpriority="high" />

    <!-- Oswald no display e Lato no texto.

         Outfit e Inter saíram porque são as fontes padrão de produto de
         software: o desenho geométrico e a largura uniforme fazem qualquer
         página parecer painel de aplicativo. Oswald é condensada e pesada,
         então o título ocupa a largura inteira sem encolher de corpo e lê
         como algo gravado, não como interface. Lato é humanista e morna,
         que é o contraponto que o texto corrido precisa para não ficar
         frio ao lado de um título tão duro. -->
    <link rel="preload" as="font" type="font/woff2" href="/fontes/oswald-700-lat.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fontes/lato-400-lat.woff2" crossorigin />

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Fixa a versão do Node. Sem isto o Netlify usa a mais recente que tiver
  # na imagem, e uma troca de major pode quebrar o build sem nenhuma
  # mudança no código.
  NODE_VERSION = "22"

# SPA: todas as rotas são resolvidas pelo React Router no navegador.
# Sem este redirecionamento, abrir /hipnoterapia direto (ou o Google
# rastrear a URL) devolve 404, porque não existe esse arquivo no servidor.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Os arquivos em /assets levam hash no nome, então nunca mudam de
# conteúdo: podem ser guardados em cache para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
